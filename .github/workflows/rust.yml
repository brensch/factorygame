name: rust

on:
  push:
    paths: ["rust/**", ".github/workflows/rust.yml"]
  pull_request:
    paths: ["rust/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo test
      - run: cargo clippy -- -D warnings
      # the whole plan rests on the core staying wasm-clean; enforce it, and
      # build the browser bridge for the same target it ships on
      - run: cargo build -p overflow-core -p overflow-web --target wasm32-unknown-unknown
      # the lab is the balance instrument; make sure a batch actually runs
      - run: cargo run --release -p overflow-lab -- --runs 200 --seed 1
