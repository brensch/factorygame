name: sim tests

on:
  push:
    paths: ["sim/**", ".github/workflows/sim.yml"]
  pull_request:
    paths: ["sim/**"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sim
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun test
