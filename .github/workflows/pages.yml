name: Deploy design doc to Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # NOTE: this step fails until Pages is enabled ONCE for the repo, at
      # Settings -> Pages -> Source: "GitHub Actions". It cannot self-enable:
      # creating a Pages site needs `administration: write`, and GITHUB_TOKEN
      # can never hold that scope. `enablement: true` was tried and fails for
      # exactly this reason — don't retry it.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
