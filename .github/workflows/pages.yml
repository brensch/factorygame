name: Deploy design doc + playable build to Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "prototype/**"
      - "rust/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The playable build is compiled here rather than committed, so the
      # deployed bundle can never drift from the tested core it wraps:
      # rust/core -> rust/web -> game.wasm, plus the canvas shell.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@v2
      - run: bun run build:play

      # Gate the deploy on the harness actually playing a round against the
      # exact wasm bytes about to ship.
      - run: bun run test:play

      # NOTE: this step fails until Pages is enabled ONCE for the repo, at
      # Settings -> Pages -> Source: "GitHub Actions". It cannot self-enable:
      # creating a Pages site needs `administration: write`, and GITHUB_TOKEN
      # can never hold that scope. `enablement: true` was tried and fails for
      # exactly this reason — don't retry it.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
